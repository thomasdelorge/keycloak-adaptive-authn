# Builds release artifacts on version tags, publishes to GitHub Releases and GitHub Packages.
# Maven cache is disabled here: a restored cache can keep Sonatype 403 markers (*.lastUpdated).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # No cache: avoid reusing ~/.m2 Sonatype resolution failures from prior release runs

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p "${HOME}/.m2"
          cat > "${HOME}/.m2/settings.xml" <<SETTINGS_EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          SETTINGS_EOF

      - name: Set release version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${VERSION}" ] || [[ "${VERSION}" == v* ]] || [[ "${VERSION}" == V* ]]; then
            echo "Invalid Maven version from tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          # versions:set only; do not run help:evaluate (triggers full dependency resolution)
          ./set-version.sh "${GITHUB_REF_NAME}"

      - name: Deploy to GitHub Packages
        run: |
          set -euo pipefail
          KC_VERSION="$(grep -m1 '<keycloak.version>' pom.xml | sed -E 's/.*<keycloak.version>([^<]+).*/\1/')"
          echo "Building against Keycloak ${KC_VERSION} (nightly)"
          echo "Publishing to https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
          rm -rf "${HOME}/.m2/repository/org/keycloak"
          find "${HOME}/.m2/repository" -name "*.lastUpdated" -delete 2>/dev/null || true
          ./mvnw -B -ntp -U clean deploy -pl core -am \
            -Dmaven.test.skip=true \
            -Pbuild-distribution \
            -Dgithub.packages.repository="${GITHUB_REPOSITORY}"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          CORE_JAR="core/target/keycloak-adaptive-authn-${VERSION}.jar"
          THEME_JAR="core/src/main/assembly/adaptive-authn-theme.jar"
          REALM_JSON="core/src/main/assembly/adaptive-realm.json"
          test -f "${CORE_JAR}"
          test -f "${THEME_JAR}"
          test -f "${REALM_JSON}"
          cp "${CORE_JAR}" dist/
          cp "${THEME_JAR}" dist/
          cp "${REALM_JSON}" dist/
          (cd dist && for f in *.jar *.json; do sha256sum "${f}" > "${f}.sha256"; done)
          ls -la dist/
          (cd dist && cat *.sha256)

      - name: Upload artifacts for release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist

      - name: Verify release assets
        run: |
          set -euo pipefail
          test -f dist/adaptive-authn-theme.jar
          test -f dist/adaptive-realm.json
          test -n "$(find dist -maxdepth 1 -name 'keycloak-adaptive-authn-*.jar' -print -quit)"

      - name: Compose release notes from tag message
        run: |
          set -euo pipefail
          TAG_MSG=""
          TAG_OBJECT_TYPE="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true)"
          if [ "${TAG_OBJECT_TYPE}" = "tag" ]; then
            # Annotated tag only; do not fall back to the peeled commit message
            TAG_MSG="$(git tag -l "${GITHUB_REF_NAME}" --format='%(contents)')"
            # Signed tags (-s): strip OpenPGP block appended to the message
            TAG_MSG="$(printf '%s\n' "${TAG_MSG}" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' | sed -e '${/^$/d;}')"
          elif [ "${TAG_OBJECT_TYPE}" = "commit" ]; then
            echo "::warning::Tag ${GITHUB_REF_NAME} is lightweight (no message). Create an annotated tag: git tag -a ${GITHUB_REF_NAME} -m '...'" >&2
          fi
          printf '%s' "${TAG_MSG}" > release-body.md
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          generate_release_notes: false
          overwrite: true
          files: |
            dist/*
